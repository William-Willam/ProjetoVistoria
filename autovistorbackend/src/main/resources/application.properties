spring.application.name=autovistorbackend

# Conexão com o banco
spring.datasource.url=jdbc:mysql://localhost:3306/autovistor
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Armazenamento de laudos
app.laudos.diretorio=${LAUDOS_DIR:./laudos}
app.fotos.diretorio=${FOTOS_DIR:./fotos-vistoria}

# Upload de fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB